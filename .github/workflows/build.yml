name: Build (macOS test)

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Mac CPU architecture'
        type: choice
        options:
          - both
          - arm64
          - amd64
        default: both
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    env:
      MAC_ARCH: ${{ inputs.architecture }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space (macOS)
        run: |
          # Keep CommandLineTools for cgo/clang.
          sudo rm -rf /Library/Developer/CoreSimulator
          sudo rm -rf /Applications/Xcode_*.app
          df -h /

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Set version
        run: echo "VERSION=dev-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - name: Update build assets
        run: wails3 task common:update:build-assets

      - name: Build macOS app
        shell: bash
        run: |
          set -euo pipefail
          case "$MAC_ARCH" in
            both)
              wails3 task darwin:build:universal VERSION="$VERSION"
              for arch in amd64 arm64; do
                cp "bin/uniTerm-$arch" bin/uniTerm
                wails3 task darwin:create:app:bundle
                mv bin/uniTerm.app "bin/uniTerm-$arch.app"
              done
              ;;
            arm64|amd64)
              wails3 build GOOS=darwin ARCH="$MAC_ARCH" VERSION="$VERSION"
              wails3 task darwin:create:app:bundle
              mv bin/uniTerm.app "bin/uniTerm-$MAC_ARCH.app"
              ;;
            *) echo "Unsupported architecture: $MAC_ARCH" >&2; exit 1 ;;
          esac

      - name: Package macOS installer
        shell: bash
        run: |
          set -euo pipefail
          ARCHES="$MAC_ARCH"
          if [ "$MAC_ARCH" = both ]; then ARCHES="amd64 arm64"; fi
          for arch in $ARCHES; do
            APP="bin/uniTerm-$arch.app"
            STAGE="$GITHUB_WORKSPACE/dmg_staging_$arch"
            mkdir -p "$STAGE"
            cp -R "$APP" "$STAGE/uniTerm.app"
            ln -s /Applications "$STAGE/Applications"
            if ! hdiutil create -volname uniTerm -srcfolder "$STAGE" -ov -format UDZO "uniterm-darwin-$arch-$VERSION.dmg"; then
              # If DMG packaging fails, provide the complete installable app.
              rm -f "uniterm-darwin-$arch-$VERSION.dmg"
              ditto -c -k --sequesterRsrc --keepParent "$APP" "uniterm-darwin-$arch-$VERSION.zip"
            fi
            rm -rf "$STAGE"
          done

      - name: Upload macOS installer
        uses: actions/upload-artifact@v7
        with:
          name: uniTerm-macOS-${{ inputs.architecture }}
          if-no-files-found: error
          compression-level: 0
          path: |
            uniterm-darwin-*.dmg
            uniterm-darwin-*.zip
