name: Build (Apple Silicon test)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space (macOS)
        run: |
          # Keep CommandLineTools for cgo/clang.
          sudo rm -rf /Library/Developer/CoreSimulator
          sudo rm -rf /Applications/Xcode_*.app
          df -h /

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Set version
        run: echo "VERSION=dev-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - name: Update build assets
        run: wails3 task common:update:build-assets

      - name: Build macOS app
        shell: bash
        run: |
          set -euo pipefail
          wails3 build GOOS=darwin ARCH=arm64 VERSION="$VERSION"
          wails3 task darwin:create:app:bundle

      - name: Run K8s resource unit tests
        working-directory: frontend
        run: npx --no-install vitest run src/services/k8sResources.test.ts src/services/propertiesPreview.test.ts

      - name: Package macOS installer
        shell: bash
        run: |
          set -euo pipefail
          APP="bin/uniTerm.app"
          STAGE="$GITHUB_WORKSPACE/dmg_staging_arm64"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/uniTerm.app"
          ln -s /Applications "$STAGE/Applications"
          if ! hdiutil create -volname uniTerm -srcfolder "$STAGE" -ov -format UDZO "uniterm-darwin-arm64-$VERSION.dmg"; then
            rm -f "uniterm-darwin-arm64-$VERSION.dmg"
            ditto -c -k --sequesterRsrc --keepParent "$APP" "uniterm-darwin-arm64-$VERSION.zip"
          fi
          rm -rf "$STAGE"

      - name: Upload macOS installer
        uses: actions/upload-artifact@v7
        with:
          name: uniTerm-macOS-arm64
          if-no-files-found: error
          compression-level: 0
          path: |
            uniterm-darwin-arm64-*.dmg
            uniterm-darwin-arm64-*.zip
